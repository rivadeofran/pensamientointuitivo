<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EPI · Admin</title>
  <link rel="icon" href="data:,">
</head>
<body>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
        }
      });
    }

    // Cargar estilos reales del sitio en el preview pane (mismas variables CSS, fuentes, etc.)
    CMS.registerPreviewStyle('/style.css');
    CMS.registerPreviewStyle('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap');

    // Helper: convierte paths relativos (assets/x.jpg) a absolutos (/assets/x.jpg) para el iframe del preview
    const resolveMedia = (p) => {
      if (!p) return null;
      if (p.startsWith('http') || p.startsWith('/')) return p;
      return '/' + p;
    };

    // ---------- Preview: PROGRAMAS (4 cards) ----------
    const ProgramasPreview = createClass({
      render() {
        const items = this.props.entry.getIn(['data', 'items']);
        if (!items) return h('div', { style: { padding: 24 } }, 'Cargando preview...');
        const arr = items.toJS();
        return h('div', { style: { padding: 32, background: 'var(--cream, #f5f3ee)', minHeight: '100vh' } },
          h('div', { style: { fontSize: 10, letterSpacing: '.32em', color: '#9a8845', marginBottom: 16, fontWeight: 500 } }, 'PREVIEW · PROGRAMAS'),
          h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '20px', maxWidth: '900px' } },
            arr.map((p, i) => {
              const mediaUrl = resolveMedia(p.media);
              const isVideo = mediaUrl && /\.(mp4|webm|mov)$/i.test(mediaUrl);
              const featured = i === 0;
              return h('article', {
                key: i,
                className: 'prog-card' + (featured ? ' prog-card--featured' : ''),
                style: { background: '#fbf9f4', borderRadius: 14, overflow: 'hidden', position: 'relative', boxShadow: featured ? '0 4px 20px -6px rgba(230,194,122,.3), 0 0 0 1px rgba(230,194,122,.5)' : '0 4px 20px -6px rgba(15,31,26,.08)' }
              },
                p.badge && h('span', {
                  style: {
                    position: 'absolute', top: 12, left: 12, zIndex: 3, fontSize: 8.5, letterSpacing: '.28em',
                    color: '#f5f3ee', fontWeight: 600, padding: '4px 8px',
                    background: 'rgba(15,31,26,0.85)', borderRadius: 999
                  }
                }, p.badge),
                h('div', { className: 'prog-card-img', style: { position: 'relative', aspectRatio: '1/1.05', overflow: 'hidden', background: '#eee' } },
                  mediaUrl
                    ? (isVideo
                        ? h('video', { src: mediaUrl, autoPlay: true, loop: true, muted: true, playsInline: true, style: { width: '100%', height: '100%', objectFit: 'cover' } })
                        : h('img', { src: mediaUrl, alt: '', style: { width: '100%', height: '100%', objectFit: 'cover' } }))
                    : h('div', { style: { width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#999', fontSize: 12 } }, '(sin imagen)')
                ),
                h('div', { className: 'prog-card-body', style: { padding: '20px 18px 22px' } },
                  p.modalidad && h('span', {
                    style: {
                      display: 'inline-block',
                      fontSize: 9.5,
                      letterSpacing: '.22em',
                      color: p.modalidad_tipo === 'hybrid' ? '#3c6e50' : '#9a8845',
                      fontWeight: 600,
                      padding: '6px 11px',
                      border: '1px solid ' + (p.modalidad_tipo === 'hybrid' ? 'rgba(60,110,80,0.35)' : 'rgba(230,194,122,0.4)'),
                      borderRadius: 999,
                      background: p.modalidad_tipo === 'hybrid' ? 'rgba(60,110,80,0.08)' : 'rgba(230,194,122,0.08)',
                      marginBottom: 12
                    }
                  }, p.modalidad),
                  h('div', { style: { fontSize: 11, letterSpacing: '.22em', color: '#9a8845', fontWeight: 500, marginBottom: 10 } }, p.num),
                  h('h3', { style: { fontFamily: 'Cormorant Garamond, serif', fontSize: 22, lineHeight: 1.1, color: '#1a2f23', margin: '0 0 10px', fontWeight: 400 } }, p.nombre),
                  p.subtitulo && h('p', { style: { fontFamily: 'Cormorant Garamond, serif', fontStyle: 'italic', fontSize: 14, lineHeight: 1.35, color: '#c9a96e', margin: '0 0 12px' } }, p.subtitulo),
                  p.metaNote && h('div', { style: { fontSize: 9, letterSpacing: '.22em', color: 'rgba(154,136,69,0.75)', marginBottom: 10, fontWeight: 500, textTransform: 'uppercase' } }, p.metaNote),
                  p.descripcion && h('p', { style: { fontSize: 12, lineHeight: 1.55, color: 'rgba(15,31,26,0.7)', margin: '0 0 12px' } }, p.descripcion),
                  h('div', { style: { width: 32, height: 1, background: '#c9a96e' } })
                ),
                p.whatsapp_text && h('div', { style: { padding: '0 18px 16px', fontSize: 10, color: '#7a6a3d', fontStyle: 'italic' } },
                  '📱 WhatsApp CTA "QUIERO SABER MÁS": "' + p.whatsapp_text + '"'
                )
              );
            })
          )
        );
      }
    });
    CMS.registerPreviewTemplate('programas', ProgramasPreview);

    // ---------- Preview: PORTADAS ----------
    const PortadasPreview = createClass({
      render() {
        const banner = resolveMedia(this.props.entry.getIn(['data', 'banner']));
        return h('div', { style: { padding: 32, background: '#0f1f1a', color: '#f5f3ee', minHeight: '100vh' } },
          h('div', { style: { fontSize: 10, letterSpacing: '.32em', color: '#e6c27a', marginBottom: 16, fontWeight: 500 } }, 'PREVIEW · BANNER PRINCIPAL'),
          banner
            ? h('img', { src: banner, style: { width: '100%', maxWidth: 1200, display: 'block', borderRadius: 4 } })
            : h('div', { style: { color: 'rgba(245,243,238,.5)', padding: 40, border: '1px dashed rgba(245,243,238,.2)', textAlign: 'center', borderRadius: 4 } }, 'Sin imagen seleccionada')
        );
      }
    });
    CMS.registerPreviewTemplate('portadas', PortadasPreview);

    // ---------- Preview: STATS ----------
    const StatsPreview = createClass({
      render() {
        const items = this.props.entry.getIn(['data', 'items']);
        if (!items) return h('div', { style: { padding: 24 } }, 'Cargando preview...');
        const arr = items.toJS();
        return h('div', { style: { padding: 40, background: '#efe9d8', minHeight: '100vh' } },
          h('div', { style: { fontSize: 10, letterSpacing: '.32em', color: '#9a8845', marginBottom: 32, fontWeight: 500 } }, 'PREVIEW · MÉTRICAS'),
          h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 36, maxWidth: 800 } },
            arr.map((s, i) => h('div', { key: i },
              h('div', { style: { fontFamily: 'Cormorant Garamond, serif', fontSize: 48, lineHeight: 1, color: '#1a2f23', marginBottom: 8, fontWeight: 400 } }, s.value || '—'),
              h('div', { style: { fontSize: 10, letterSpacing: '.28em', color: '#7a6a3d', fontWeight: 500 } }, s.label || '—')
            ))
          )
        );
      }
    });
    CMS.registerPreviewTemplate('stats', StatsPreview);

    // ---------- Preview: PANEL HERO ----------
    const PanelHeroPreview = createClass({
      render() {
        const data = this.props.entry.get('data').toJS();
        const tipo = (data.tipo || 'anuncio').toLowerCase();
        const panelStyle = {
          padding: '32px 28px',
          background: 'rgba(10,20,15,.85)',
          backdropFilter: 'blur(24px)',
          border: '1px solid rgba(230,194,122,.25)',
          borderRadius: 14,
          color: '#f5f3ee',
          maxWidth: 380,
          margin: '20px auto',
          fontFamily: 'Schibsted Grotesk, sans-serif'
        };
        return h('div', { style: { padding: 24, background: '#0a140f', minHeight: '100vh' } },
          h('div', { style: { fontSize: 10, letterSpacing: '.32em', color: '#e6c27a', marginBottom: 16, fontWeight: 500 } }, 'PREVIEW · PANEL HERO (' + tipo.toUpperCase() + ')'),
          h('div', { style: panelStyle },
            h('div', { style: { display: 'flex', alignItems: 'center', gap: 10, marginBottom: 16 } },
              h('span', { style: { width: 8, height: 8, background: '#e6c27a', borderRadius: '50%' } }),
              h('span', { style: { fontSize: 10, letterSpacing: '.28em', color: '#e6c27a' } }, data.label || '—')
            ),
            h('h3', { style: { fontFamily: 'Cormorant Garamond, serif', fontSize: 22, lineHeight: 1.15, margin: '0 0 12px', fontWeight: 400 } }, data.title || '—'),
            (tipo === 'anuncio' || tipo === 'podcast') && data.description &&
              h('p', { style: { fontSize: 13, lineHeight: 1.55, color: 'rgba(245,243,238,.75)', margin: '0 0 16px' } }, data.description),
            tipo === 'anuncio' &&
              h('div', { style: { fontSize: 10, letterSpacing: '.18em', color: 'rgba(245,243,238,.55)', margin: '0 0 18px' } },
                (data.meta1 || '') + (data.meta1 && data.meta2 ? '  •  ' : '') + (data.meta2 || '')),
            tipo === 'video' && data.videoUrl &&
              h('div', { style: { background: '#000', aspectRatio: '16/9', borderRadius: 8, marginBottom: 16, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#888', fontSize: 11 } }, '▶ Video YouTube'),
            tipo === 'podcast' && data.spotifyUrl &&
              h('div', { style: { background: '#1db954', borderRadius: 8, marginBottom: 16, padding: 16, fontSize: 11, color: '#fff' } }, '♫ Reproductor Spotify'),
            h('div', {
              style: {
                display: 'inline-flex', alignItems: 'center', gap: 10,
                padding: '12px 20px', background: 'rgba(230,194,122,.15)',
                border: '1px solid rgba(230,194,122,.4)', borderRadius: 999,
                fontSize: 11, letterSpacing: '.22em', color: '#e6c27a', fontWeight: 600
              }
            }, (data.ctaText || 'MÁS INFORMACIÓN') + '  →'),
            data.ctaUrl && h('div', { style: { fontSize: 9, color: 'rgba(245,243,238,.4)', marginTop: 10 } }, '→ ' + data.ctaUrl)
          )
        );
      }
    });
    CMS.registerPreviewTemplate('panel_hero', PanelHeroPreview);
  </script>
</body>
</html>
